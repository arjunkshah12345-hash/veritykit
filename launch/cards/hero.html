<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1600px; height: 900px; overflow: hidden; background: #111; }
      body {
        font-family: Geist, "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #fff;
        display: grid;
        grid-template-columns: 1fr 720px;
      }
      .copy {
        padding: 88px 72px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 76px;
        line-height: 0.95;
        letter-spacing: -0.03em;
        max-width: 11ch;
      }
      h1 em { font-style: italic; color: #fae54d; }
      .sub {
        font-size: 22px;
        line-height: 1.35;
        color: #ffffffb8;
        max-width: 22ch;
      }
      .paint {
        position: relative;
        background: #0b0b0b;
      }
      .paint img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: pixelated;
      }
      .cap {
        position: absolute;
        left: 28px;
        bottom: 28px;
        font-family: ui-monospace, "Geist Mono", Menlo, monospace;
        font-size: 13px;
        color: #f5f5f5;
        background: #111c;
        backdrop-filter: blur(8px);
        padding: 10px 12px;
        border: 1px solid #ffffff1a;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="mark">Verity</div>
      <h1>The picture is subjective.<br /><em>The program is not.</em></h1>
      <p class="sub">A training loop for work you cannot grade.</p>
    </div>
    <div class="paint">
      <img src="../out/sunset-hi.png" alt="" />
      <div class="cap">witness · ran=1 · uses=1 · coverage=1</div>
    </div>
  </body>
</html>
