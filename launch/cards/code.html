<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@500&family=Instrument+Serif&display=swap"

    <style>
      * { box-sizing: border-box; margin: 0; }

        font-weight: 400;

      }
      pre {
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;

        line-height: 1.6;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        padding: 40px 44px;
      }
      .k { color: #fb7185; }
      .c { color: #38bdf8; }
      .p { color: #c084fc; }
      .s { color: #4ade80; }
      .q { color: #737373; }

  </head>
  <body>
    <div>
      <div class="kicker">pnpm add veritykit</div>
      <h1>The surface is small on purpose.</h1>
    </div>
    <pre><span class="k">import</span> { createTrainer, execute, reinforce, sft } <span class="k">from</span> <span class="s">'veritykit'</span>

<span class="k">await</span> createTrainer({ model, method: sft() }).fit(labeled)

<span class="k">await</span> createTrainer({
  model,
  method: reinforce({ bridge: execute({ <span class="p">runtime</span>: <span class="s">'canvas'</span> }) }),
}).fit(paintTasks)</pre>
