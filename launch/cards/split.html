<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@500&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1600px; height: 900px; overflow: hidden; background: #111; }
      body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        color: #f5f5f5;
        font-family: Geist, Helvetica, sans-serif;
      }
      .side {
        padding: 56px 56px 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .side.right { padding: 0; position: relative; }
      .kicker {
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      h2 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 42px;
        line-height: 1.05;
      }
      pre {
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;
        font-size: 18px;
        line-height: 1.55;
        color: #e5e5e5;
      }
      .k { color: #fb7185; }
      .p { color: #c084fc; }
      .s { color: #4ade80; }
      .q { color: #737373; }
      .n { color: #38bdf8; }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tag {
        position: absolute;
        right: 24px;
        bottom: 24px;
        font-family: "Geist Mono", ui-monospace, Menlo, monospace;
        font-size: 13px;
        padding: 10px 12px;
        background: #111c;
        border: 1px solid #ffffff1a;
      }
    </style>
  </head>
  <body>
    <div class="side">
      <div class="kicker">completion</div>
      <pre><span class="q">// the model wrote this</span>
x.<span class="p">fillStyle</span>=<span class="s">'#1e3a8a'</span>;
x.<span class="n">fillRect</span>(<span class="n">0</span>,<span class="n">0</span>,<span class="n">64</span>,<span class="n">40</span>);
x.<span class="p">fillStyle</span>=<span class="s">'#ea580c'</span>;
x.<span class="n">fillRect</span>(<span class="n">0</span>,<span class="n">28</span>,<span class="n">64</span>,<span class="n">12</span>);
x.<span class="p">fillStyle</span>=<span class="s">'#eab308'</span>;
x.<span class="k">beginPath</span>();
x.<span class="n">arc</span>(<span class="n">44</span>,<span class="n">22</span>,<span class="n">8</span>,<span class="n">0</span>,<span class="n">6.28</span>);
x.<span class="n">fill</span>();</pre>
      <h2>A completion is not a label.</h2>
    </div>
    <div class="side right">
      <img src="../out/sunset-hi.png" alt="" />
      <div class="tag">witness</div>
    </div>
  </body>
</html>
