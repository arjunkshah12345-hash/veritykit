<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #111; color: #fff; }
      body {
        font-family: Geist, Helvetica, sans-serif;
        display: grid;
        grid-template-rows: 700px 380px;
      }
      .paint { position: relative; overflow: hidden; }
      .paint img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .copy {
        padding: 48px 56px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a3a3a3;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 64px;
        line-height: 0.96;
        letter-spacing: -0.03em;
      }
      h1 em { font-style: italic; color: #fae54d; }
    </style>
  </head>
  <body>
    <div class="paint">
      <img src="../out/sunset-hi.png" alt="" />
    </div>
    <div class="copy">
      <div class="mark">Verity</div>
      <h1>Make the unverifiable <em>trainable</em>.</h1>
    </div>
  </body>
</html>
